# Server
server.port=8080

# JSP ViewResolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# \uc218\ub3d9 Bean\uc774 \uc790\ub3d9 Bean\uc744 \uc624\ubc84\ub77c\uc774\ub529\ud558\uac8c \uc124\uc815
spring.main.allow-bean-definition-overriding=true

# open-in-view(\ud639\uc740 Open-Session-In-View(OSIV))
# true(\uae30\ubcf8\uac12) : \uc0ac\uc6a9\uc790\uc5d0\uac8c \uc751\ub2f5 \ub610\ub294 view\uac00 \ub80c\ub354\ub9c1\ub420 \ub54c\uae4c\uc9c0 \uc601\uc18d\uc131 \ucee8\ud14d\uc2a4\ud2b8 \uc720\uc9c0
# false : \ud2b8\ub79c\uc7ad\uc158\uc774 \uc885\ub8cc\ub420 \ub54c \uc601\uc18d\uc131 \ucee8\ud14d\uc2a4\ud2b8 \uc885\ub8cc
spring.jpa.open-in-view=false

# KOSA \ud658\uacbd\ubcc0\uc218 \uc5f0\ub3d9
spring.datasource.driver-class-name=${JDBC_DRIVER}
spring.datasource.url=${JDBC_URL}
spring.datasource.username=${JDBC_USERNAME}
spring.datasource.password=${JDBC_PASSWORD}
# SGIS API \uc778\uc99d \uc815\ubcf4
sgis.consumer-key=${SGIS_CONSUMER_KEY}
sgis.consumer-secret=${SGIS_CONSUMER_SECRET}

# \u00ec\u008a\u00a4\u00ed\u0094\u0084\u00eb\u00a7\u0081 \u00ec\u008b\u00a4\u00ed\u0096\u0089 \u00ec\u008b\u009c schema.sql \u00ec\u009e\u0090\u00eb\u008f\u0099 \u00ec\u008b\u00a4\u00ed\u0096\u0089 \u00ed\u0099\u009c\u00ec\u0084\u00b1\u00ed\u0099\u0094
# DBeaver\u00ec\u0097\u0090 \u00ed\u0085\u008c\u00ec\u009d\u00b4\u00eb\u00b8\u0094\u00ec\u009d\u00b4 \u00ec\u0083\u009d\u00ec\u0084\u00b1\u00eb\u0090\u0098\u00ec\u0096\u00b4 \u00ec\u009e\u0088\u00ec\u009d\u0084 \u00ea\u00b2\u00bd\u00ec\u009a\u00b0 never. \u00ec\u00b2\u0098\u00ec\u009d\u008c \u00ec\u0084\u00b8\u00ed\u008c\u0085 \u00ec\u008b\u009c never\u00eb\u00a5\u00bc always\u00eb\u00a1\u009c \u00ec\u0088\u0098\u00ec\u00a0\u0095
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=\
classpath:db/seed/initial_scenario_data.sql,\
classpath:db/seed/initial_qna_category_data.sql,\
classpath:db/seed/initial_member_data.sql,\
classpath:db/seed/initial_qna_data.sql
spring.sql.init.encoding=UTF-8

# SQL \uc2a4\ud06c\ub9bd\ud2b8 \ucd08\uae30\ud654 \uc2e4\ud589 \ub85c\uadf8 \ud655\uc778 (DEBUG \ub808\ubca8)
logging.level.org.springframework.jdbc.datasource.init=DEBUG

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# API \uacbd\ub85c\ub9cc \ubb38\uc11c\ud654
springdoc.paths-to-match=/api/**

# \uba54\uc2dc\uc9c0 \ud30c\uc77c \uc124\uc815
spring.messages.basename=messages,simulation-fields
spring.messages.encoding=UTF-8

# MyBatis Mapper XML \uacbd\ub85c
mybatis.mapper-locations=classpath:mapper/**/*.xml

# MyBatis snake_case \u2192 camelCase \uc790\ub3d9 \ub9e4\ud551
mybatis.configuration.map-underscore-to-camel-case=true

# Gmail SMTP \uc11c\ubc84 \uc8fc\uc18c\uc640 \ud3ec\ud2b8. \ud658\uacbd\ubcc0\uc218\uac00 \uc5c6\uc73c\uba74 \uae30\ubcf8\uac12 \uc0ac\uc6a9
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}

# \uba54\uc77c\uc744 \ubcf4\ub0b4\ub294 \uacc4\uc815\uacfc \ud574\ub2f9 \uacc4\uc815\uc758 \uc571 \ube44\ubc00\ubc88\ud638
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}

# \ud55c\uae00 \uc81c\ubaa9\uacfc \ubcf8\ubb38\uc5d0 \uc0ac\uc6a9\ud560 \ubb38\uc790 \uc778\ucf54\ub529
spring.mail.default-encoding=UTF-8

# SMTP \uacc4\uc815 \uc778\uc99d\uacfc TLS \uc554\ud638\ud654 \uc5f0\uacb0 \uc0ac\uc6a9
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
