# Server
server.port=8080

# JSP ViewResolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# 수동 Bean이 자동 Bean을 오버라이딩하게 설정
spring.main.allow-bean-definition-overriding=true

# open-in-view(혹은 Open-Session-In-View(OSIV))
# true(기본값) : 사용자에게 응답 또는 view가 렌더링될 때까지 영속성 컨텍스트 유지
# false : 트랜잭션이 종료될 때 영속성 컨텍스트 종료
spring.jpa.open-in-view=false

# KOSA 환경변수 연동
spring.datasource.driver-class-name=${JDBC_DRIVER}
spring.datasource.url=${JDBC_URL}
spring.datasource.username=${JDBC_USERNAME}
spring.datasource.password=${JDBC_PASSWORD}
# SGIS API 인증 정보
sgis.consumer-key=${SGIS_CONSUMER_KEY}
sgis.consumer-secret=${SGIS_CONSUMER_SECRET}
# 도로명주소 팝업 API
juso.confirm-key=${JUSO_CONFIRM_KEY}

# 스프링 실행 시 schema.sql 자동 실행 활성화
# DBeaver에 테이블이 생성되어 있을 경우 never. 처음 세팅 시 never를 always로 수정
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=\
classpath:db/seed/initial_scenario_data.sql,\
classpath:db/seed/initial_qna_category_data.sql,\
classpath:db/seed/initial_member_data.sql,\
classpath:db/seed/initial_qna_data.sql
spring.sql.init.encoding=UTF-8

# SQL 스크립트 초기화 실행 로그 확인 (DEBUG 레벨)
logging.level.org.springframework.jdbc.datasource.init=DEBUG

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# API 경로만 문서화
springdoc.paths-to-match=/api/**

# 메시지 파일 설정
spring.messages.basename=messages,simulation-fields
spring.messages.encoding=UTF-8

# MyBatis Mapper XML 경로
mybatis.mapper-locations=classpath:mapper/**/*.xml

# MyBatis snake_case → camelCase 자동 매핑
mybatis.configuration.map-underscore-to-camel-case=true

# Gmail SMTP 서버 주소와 포트. 환경변수가 없으면 기본값 사용
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}

# 메일을 보내는 계정과 해당 계정의 앱 비밀번호
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}

# 한글 제목과 본문에 사용할 문자 인코딩
spring.mail.default-encoding=UTF-8

# SMTP 계정 인증과 TLS 암호화 연결 사용
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 로그인 세션 유지 시간: 마지막 요청 이후 60분
server.servlet.session.timeout=60m
