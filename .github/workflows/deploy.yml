name: HaeBom CI/CD Deploy to AWS EC2

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: haebom-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 Checkout
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. WAR 빌드
      - name: Build WAR with Maven
        run: mvn clean package -DskipTests

      - name: Verify WAR Artifact
        run: test -s target/HaeBom-1.0.0.war

      # 4. AWS OIDC 인증
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
          allowed-account-ids: '618158385801'

      # 5. Runner 공인 IPv4 확인
      - name: Get Runner IP
        id: runner-ip
        run: |
          IP=$(curl -4fsS https://api.ipify.org)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      # 6. Runner IP만 SSH 임시 허용
      - name: Allow Runner SSH
        id: allow-ssh
        env:
          RUNNER_IP: ${{ steps.runner-ip.outputs.ip }}
        run: |
          RULE_ID=$(aws ec2 authorize-security-group-ingress \
            --group-id sg-0695a5ff658ec72d3 \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32,Description=haebom-actions-${GITHUB_RUN_ID}}]" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' \
            --output text)

          echo "rule_id=$RULE_ID" >> "$GITHUB_OUTPUT"

      # 7. WAR 파일 전송
      - name: Transfer WAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          source: "target/HaeBom-1.0.0.war"
          target: "/home/ec2-user"
          strip_components: 1

      # 8. systemd 배포
      - name: Deploy and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          script: |
            set -eu

            cd /opt/haebom

            echo "=== 배포 파일 확인 ==="
            test -s /home/ec2-user/HaeBom-1.0.0.war

            echo "=== 기존 WAR 백업 ==="
            cp -p haebom.war haebom-backup.war

            echo "=== 신규 WAR 교체 ==="
            cp /home/ec2-user/HaeBom-1.0.0.war haebom.war.new
            chmod 644 haebom.war.new
            mv -f haebom.war.new haebom.war

            echo "=== systemd 재시작 ==="
            sudo -n systemctl restart haebom

            echo "=== 서버 정상 응답 확인 ==="
            READY=0
            for i in $(seq 1 30); do
              if curl --silent --fail \
                http://127.0.0.1:8080/ > /dev/null; then
                READY=1
                break
              fi
              sleep 2
            done

            if [ "$READY" -ne 1 ]; then
              echo "배포 실패 - 기존 WAR 복구"
              cp -p haebom-backup.war haebom.war.new
              mv -f haebom.war.new haebom.war
              sudo -n systemctl restart haebom
              exit 1
            fi

            sudo -n systemctl is-active --quiet haebom
            echo "배포 성공"

      # 9. 임시 SSH 허용 규칙 제거
      - name: Remove Runner SSH Access
        if: ${{ always() && steps.allow-ssh.outputs.rule_id != '' }}
        env:
          RULE_ID: ${{ steps.allow-ssh.outputs.rule_id }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id sg-0695a5ff658ec72d3 \
            --security-group-rule-ids "$RULE_ID"
