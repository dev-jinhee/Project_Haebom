name: HaeBom CI/CD Deploy to AWS EC2

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: haebom-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build WAR with Maven
        run: mvn clean package -DskipTests

      - name: Verify WAR Artifact
        run: test -f target/HaeBom-1.0.0.war

      - name: Transfer WAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          source: "target/HaeBom-1.0.0.war"
          target: "/home/ec2-user"
          strip_components: 1

      - name: Deploy and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          script: |
            set -eu

            cd /opt/haebom

            echo "=== 배포 파일 확인 ==="
            test -s /home/ec2-user/HaeBom-1.0.0.war

            echo "=== 기존 WAR 백업 ==="
            cp -p haebom.war haebom-backup.war

            echo "=== 신규 WAR 교체 ==="
            cp /home/ec2-user/HaeBom-1.0.0.war haebom.war.new
            chmod 644 haebom.war.new
            mv -f haebom.war.new haebom.war

            echo "=== systemd 서비스 재시작 ==="
            sudo -n systemctl restart haebom

            echo "=== 서버 정상 동작 확인 ==="
            READY=0
            for i in $(seq 1 30); do
              if curl --silent --fail \
                http://127.0.0.1:8080/ \
                > /dev/null; then
                READY=1
                break
              fi
              sleep 2
            done

            if [ "$READY" -ne 1 ]; then
              echo "배포 실패 - 이전 WAR 복구"
              cp -p haebom-backup.war haebom.war.new
              mv -f haebom.war.new haebom.war
              sudo -n systemctl restart haebom
              exit 1
            fi

            echo "=== 배포 성공 ==="
            sudo -n systemctl is-active --quiet haebom
