name: HaeBom CI/CD Deploy to AWS EC2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # GitHub 웹(Actions 탭)에서 수동으로 즉시 실행 가능

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 코드 가져오기
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Java 17 (Temurin) 설정 & Maven 캐싱
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Maven을 통한 WAR 빌드 (테스트 스킵으로 빠른 배포)
      - name: Build WAR with Maven
        run: mvn clean package -DskipTests

      # 4. 빌드된 WAR 파일을 EC2로 전송 (SCP)
      - name: Transfer WAR to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/HaeBom-1.0.0.war"
          target: "/home/${{ secrets.EC2_USER }}"
          strip_components: 1

      # 5. EC2 원격 접속(SSH) 후 기존 프로세스 종료 및 새 버전 재시작
      - name: Deploy and Restart Application on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            # 1. 서버에 등록된 환경변수 로드 (.bashrc, /etc/environment 등)
            [ -f ~/.bashrc ] && source ~/.bashrc
            [ -f ~/.profile ] && source ~/.profile
            [ -f /etc/environment ] && source /etc/environment

            cd /home/${{ secrets.EC2_USER }}

            echo "=== [1/3] 기존 실행 중인 HaeBom 프로세스 확인 및 종료 ==="
            PID=$(pgrep -f "HaeBom.*\.war" || true)
            if [ -n "$PID" ]; then
              echo "기존 프로세스(PID: $PID) 종료 시도 중..."
              kill -15 $PID 2>/dev/null || true
              sleep 5
              if kill -0 $PID 2>/dev/null; then
                echo "강제 종료(kill -9) 실행..."
                kill -9 $PID 2>/dev/null || true
                sleep 2
              fi
              echo "기존 프로세스 종료 완료."
            else
              echo "실행 중인 기존 프로세스가 없습니다."
            fi

            echo "=== [2/3] 새 버전 HaeBom 애플리케이션 기동 ==="
            # run.sh 스크립트가 있을 경우 run.sh 실행, 없으면 직접 nohup java -jar 실행
            if [ -f "./run.sh" ]; then
              echo "기존 run.sh 스크립트를 감지하여 실행합니다."
              chmod +x ./run.sh
              nohup ./run.sh > app.log 2>&1 &
            else
              echo "nohup java -jar 명령어로 백그라운드 기동합니다."
              nohup java -jar HaeBom-1.0.0.war > app.log 2>&1 &
            fi

            # 기동 대기
            sleep 5

            echo "=== [3/3] 프로세스 기동 상태 확인 ==="
            NEW_PID=$(pgrep -f "HaeBom.*\.war" || true)
            if [ -n "$NEW_PID" ]; then
              echo "🎉 HaeBom 배포 및 실행 성공! (PID: $NEW_PID)"
              echo "--- 최근 15줄 실행 로그 ---"
              tail -n 15 app.log
            else
              echo "❌ 애플리케이션 시작 실패! app.log 확인이 필요합니다."
              [ -f app.log ] && tail -n 30 app.log
              exit 1
            fi
